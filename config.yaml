# ─── Image Segmenter Configuration ─────────────────────────────────────────
# Edit values below to tune behavior. Restart the app after changes.
# All parameters include their default values.

# ─── Segmentation Parameters ───────────────────────────────────────────────

# Minimum segment area in pixels (at original image resolution).
# Segments smaller than this are discarded.
# Range: 100–50000. Lower = more small fragments, higher = only large objects.
# 6000 is safe with the quality filters (aspect ratio, fill ratio, color std)
# which handle text rejection. Lower values recover small compact objects.
min_area: 6000

# Maximum image dimension (width or height) for SAM inference.
# Larger images are resized to fit within this before segmentation;
# masks are then upscaled back to original resolution.
# Range: 1024–4096. Higher = better quality but slower and more VRAM.
# 2048 is recommended for 32GB machines; 3072+ needs 64GB+.
max_dim: 2048

# Maximum number of segments to retain per image.
# Range: 10–500. More segments = more disk I/O and processing time.
max_segments: 50

# Output upscale factor for rendered/saved segment PNGs.
# 1 = native resolution, 2 = 2x, 4 = 4x (sticker/print quality).
# Range: 1–4. Higher = larger files, more memory during rendering.
upscale: 1

# ─── SAM 2.1 Model Parameters ──────────────────────────────────────────────
# These control how SAM 2.1's automatic mask generator creates masks.
# Tune with care — small changes can significantly affect output.

# Grid density for point prompts (points_per_side x points_per_side).
# More points = finer segmentation but slower inference.
# Range: 16–64. 32 gives best coverage; post-filters handle noise.
# Memory scales as n² but the quality filters keep output clean.
points_per_side: 32

# Predicted IoU threshold. Masks below this confidence level are discarded.
# Range: 0.70–0.95. Keep permissive; post-filters handle quality.
pred_iou_thresh: 0.84

# Stability score threshold. Measures mask consistency when the
# binarization threshold is varied. More stable masks are more reliable.
# Range: 0.80–0.97. Keep permissive; post-filters handle quality.
stability_score_thresh: 0.90

# Minimum mask region area at inference resolution (before any upscaling).
# SAM's own internal noise filter — catches tiny artefacts.
# Range: 50–1000. Higher values reduce peak memory by discarding small
# masks before they accumulate in the mask list.
min_mask_region_area: 500

# Minimum color standard deviation within a segment's masked pixels.
# Segments with lower variance than this are likely flat backgrounds
# (e.g. white slide regions). Set to 0 to disable. Range: 0–30.
min_color_std: 15.0

# Minimum mean saturation (HSV) for small segments (area < 15000).
# Dark text on slides has near-zero saturation; coloured icons/graphics
# have higher saturation. Set to 0 to disable. Range: 0–60.
min_saturation: 25

# Minimum fill ratio (mask area / bounding box area).
# Text and thin shapes have low fill ratios (~0.3–0.5). Solid objects
# like icons and photos fill their bbox more densely (~0.6–0.9).
# Range: 0.0–0.8. Set to 0 to disable.
min_fill_ratio: 0.45

# Maximum aspect ratio (long side / short side) for segments.
# Segments more elongated than this are discarded (e.g. grid lines,
# text words, thin borders). Set to 0 to disable. Range: 2–20.
# 3.5 filters most single-word text while keeping real objects.
max_aspect_ratio: 3.5

# IoU threshold for deduplicating near-identical overlapping masks.
# SAM can produce duplicates from adjacent point prompts.
# Range: 0.70–0.95. Lower = more aggressive deduplication.
iou_dedup_thresh: 0.8

# Containment threshold for removing sub-component segments.
# If this fraction of a smaller segment's pixels lie inside a larger
# kept segment, the smaller one is discarded as a sub-component.
# Range: 0.5–0.95. Lower = more aggressive sub-component removal.
# Set to 0 to disable.
containment_thresh: 0.7

# Maximum area (at inference resolution) for the "small high-fill = text" check.
# Segments with area below this AND fill ratio above 0.90 are rejected as text
# (e.g. "OK", "CME" labels on slides). Inference resolution = original / scale.
# At max_dim=2048 with a 4096px source, inference res is 2048px, so 20000 here
# ≈ 80000 original-resolution pixels. Range: 5000–50000. Set high to be lenient.
text_fill_area_thresh: 20000

# Maximum area (at original resolution) for the saturation-based text filter.
# Only segments smaller than this are checked for low HSV saturation.
# At original resolution. Range: 5000–50000.
small_seg_area: 15000

# Minimum mask area (at inference resolution) for morphological cleanup.
# Masks smaller than this skip MORPH_CLOSE/OPEN to avoid destroying thin shapes.
# At inference resolution. Range: 200–2000.
morph_min_area: 800

# ─── Thumbnail Settings ────────────────────────────────────────────────────

# Maximum dimension (px) for gallery thumbnail previews.
# Range: 256–1024. 512 is sharp on retina/HiDPI displays.
thumb_max: 512

# ─── Edge Feathering ───────────────────────────────────────────────────────
# Controls the soft alpha gradient at segment edges for clean compositing.
# Feather radius scales with segment size:
#   feather_px = clamp(min(width, height) * feather_factor, min, max)

# Minimum feather radius in pixels.
# Increased from 1.0 to 1.5 for smoother edges on small segments.
feather_min_px: 1.5

# Maximum feather radius in pixels.
# Increased from 3.0 to 4.0 for better edge blending on large segments.
feather_max_px: 4.0

# Feather factor (proportion of the segment's smaller dimension).
# Increased from 0.008 to 0.012 for proportionally softer edges.
feather_factor: 0.012

# ─── Edge Processing (Advanced) ───────────────────────────────────────
# These control the mask cleanup and smoothing pipeline.
# Only change if you understand the rendering pipeline.

# Morphological cleanup kernel size (pixels). Removes isolated noise.
# Must be odd. Range: 3–7. Larger = more aggressive cleanup.
morph_kernel_size: 3

# Contour smoothing sigma bounds. Controls how much the mask boundary
# is smoothed. Sigma = clamp(perimeter / divisor, min, max).
# Reduced sigma_min from 2.5 to 2.0 for smoother edges on simple shapes.
# Reduced divisor from 180 to 150 for slightly more smoothing overall.
contour_sigma_min: 2.0
contour_sigma_max: 18.0
contour_sigma_divisor: 150.0

# Final alpha blur after distance-transform feathering.
# Set kernel to 1 and sigma to 0 for perfectly sharp edges.
# Increased kernel from 3 to 5 and sigma from 0.4 to 0.6 for softer
# edge transitions that reduce visible jagged edges.
feather_blur_kernel: 5
feather_blur_sigma: 0.6

# Distance transform mask size for edge feathering (OpenCV param).
# Options: 3, 5. 5 = more precise distance computation.
dist_transform_mask_size: 5

# Sigmoid sharpness for mask upscaling. Controls how aggressively grey
# fringe pixels are pushed to 0 or 255 during mask upscale from inference
# to full resolution. Higher = sharper edge, lower = softer anti-aliasing.
# Range: 0.04–0.15. Reduced from 0.08 to 0.06 for smoother anti-aliasing
# at segment boundaries, reducing hard pixel staircase artifacts.
mask_upscale_sharpness: 0.06

# Maximum allowed upscale factor (safety cap to prevent OOM).
max_upscale: 4

# ─── Tight Cropping ────────────────────────────────────────────────────────
# Remove empty transparent space around segments for smaller file sizes.

# Enable tight cropping. When true, rendered segments are cropped to
# the bounding box of their visible (non-transparent) pixels.
tight_crop: true

# Padding in pixels added around the tight crop boundary.
# Applied at pre-upscale resolution (so 4px becomes 8px at 2x upscale).
# Range: 0–20. A small pad prevents content from touching the edge.
tight_crop_padding: 4

# ─── Edge Presets ─────────────────────────────────────────────────────
# Defaults above are tuned for balanced edge quality (smooth but defined).
# For sharper sticker-style edges, use these values:
# feather_min_px: 1.0
# feather_max_px: 3.0
# feather_blur_kernel: 3
# feather_blur_sigma: 0.4
# feather_factor: 0.008
# mask_upscale_sharpness: 0.08
#
# For softer compositing (photo blending), use these values:
# feather_min_px: 2.0
# feather_max_px: 6.0
# feather_blur_kernel: 7
# feather_blur_sigma: 1.0
# feather_factor: 0.015

# ─── PDF Pipeline Settings ─────────────────────────────────────────────────

# DPI for rasterising PDF pages to images.
# Range: 72–600. 150 = fast/compact, 200 = balanced, 300 = print-quality.
# Higher DPI produces larger slide images, improving segmentation detail
# at the cost of speed and memory.
pdf_dpi: 200

# Image format for converted PDF pages.
# Options: png (lossless, larger), jpg (lossy, smaller).
pdf_image_format: png

# Maximum concurrent workers for rendering segments.
# Lower values reduce peak memory usage at the cost of speed.
# Range: 1–8. 2 is safe for 32GB Apple Silicon; 4 for 64GB+.
render_workers: 2

# ─── Default Paths (for PDFs placed in data/pdfs/) ─────────────────────────
# When a PDF lives outside data/pdfs/, the pipeline auto-creates
# slide_images/ and slide_image_segments/ next to the PDF instead.

# Base data directory (relative to project root).
data_dir: data

# Subdirectory under data_dir for input PDFs.
pdf_subdir: pdfs

# Subdirectory under data_dir for converted slide images.
images_subdir: images

# Subdirectory under data_dir for segmented output assets.
segments_subdir: segments

# ─── Web Server Settings ───────────────────────────────────────────────────

# Maximum upload file size in megabytes.
max_upload_mb: 50

# Session time-to-live in seconds. Uploaded files and results are
# cleaned up after this period.
session_ttl: 3600

# Flask server bind address and port.
host: "127.0.0.1"
port: 5000
